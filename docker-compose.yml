# 项目名固定为 text_router（不依赖部署目录名），服务名用 app，镜像名即 text_router_app
name: text_router

services:
  app:
    build: .
    container_name: app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      BACKUP_DIR: /app/data/backups
      TZ: "${TZ:-Asia/Shanghai}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SUPER_ADMIN_USER: "${SUPER_ADMIN_USER:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      REQUESTLOG_CAPACITY: "${REQUESTLOG_CAPACITY:-2000}"
      SELFCHECK_TIMEOUT_SECONDS: "${SELFCHECK_TIMEOUT_SECONDS:-8}"
      SELFCHECK_ALLOWED_HOSTS: "${SELFCHECK_ALLOWED_HOSTS:-}"
      BACKUP_ENABLED: "${BACKUP_ENABLED:-false}"
      BACKUP_TIME: "${BACKUP_TIME:-23:00}"
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
